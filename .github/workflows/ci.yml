name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SportsClubHub.sln

      - name: Release build
        run: dotnet build SportsClubHub.sln --configuration Release --no-restore

      - name: Tests
        run: dotnet test SportsClubHub.sln --configuration Release --no-build --no-restore --logger trx

      - name: Check for likely committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -I -E \
            '(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|mongodb(\+srv)?://[^[:space:]]+:[^[:space:]]+@|P[a]ssword=[^<[:space:]]{8,}|Email__P[a]ssword=[^<[:space:]]{8,})' \
            -- ':!*.md' ':!.env.example' ':!.github/workflows/ci.yml'; then
            echo "Potential secret detected in tracked non-documentation files."
            exit 1
          fi

      - name: Validate Docker image
        run: docker build --tag sportshub-rsa:ci .
